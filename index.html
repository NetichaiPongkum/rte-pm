<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PM Mold RTE</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Thai', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50:  '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                            950: '#1e1b4b',
                        },
                        surface: {
                            50:  '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            700: '#1e293b',
                            800: '#0f172a',
                            900: '#020617',
                        }
                    }
                }
            }
        }

    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Utilities -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script type="module" src="js/supabase/client.js"></script>
    <script src="js/supabase/auth.js" defer></script>
    <script src="js/supabase/database.js" defer></script>
    <script src="js/supabase/storage.js" defer></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="css/variables.css">

    <link rel="stylesheet" href="css/components.css">

<body class="bg-surface-900 text-white font-sans antialiased">
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 z-[9999] flex items-center justify-center bg-surface-900">

            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-surface-200 text-sm animate-pulse">กำลังโหลดระบบ...</p>
        </div>
    </div>

    <!-- App Root -->
    <div id="root"></div>

    <!-- Page Components -->
    <script type="text/babel" src="js/pages/login.js"></script>
    <script type="text/babel" src="js/pages/parts.js"></script>
    <script type="text/babel" src="js/pages/checklist-admin.js"></script>
    <script type="text/babel" src="js/pages/checklist.js"></script>
    <script type="text/babel" src="js/pages/pm-history.js"></script>
    <script type="text/babel" src="js/pages/settings.js"></script>

    <script type="text/babel" src="js/app.js"></script>
